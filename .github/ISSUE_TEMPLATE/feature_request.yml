name: 💡 Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape YFS Archive API! Check the [Roadmap](https://github.com/Yukthi-Systems/YFS-Archive-API#roadmap) first, as your idea may already be planned.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/Yukthi-Systems/YFS-Archive-API/issues?q=is%3Aissue) and this hasn't been requested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
      placeholder: "When archiving folders larger than 4 GiB over a slow connection, the download ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include API or config changes if you have them in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - API / HTTP
        - Archive generation (zip/tar)
        - SSE progress
        - Database / queries
        - Storage servers
        - Docker / deployment
        - Scaling (Redis / S3)
        - Documentation
        - Other

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to submit a pull request for this.
