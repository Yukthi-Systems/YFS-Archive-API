name: 🐛 Bug report
description: Something isn't working as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issue?** Please don't file it here. Follow [SECURITY.md](https://github.com/Yukthi-Systems/YFS-Archive-API/blob/main/SECURITY.md) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched [existing issues](https://github.com/Yukthi-Systems/YFS-Archive-API/issues?q=is%3Aissue) and this hasn't been reported yet.
          required: true
        - label: I removed secrets (DATABASE_URL passwords, storage keys, download tokens) from everything below.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including the request body and endpoint if relevant.
      placeholder: |
        1. POST /internal/archives with {"root_folder_id": "...", "export_type": "tar"}
        2. GET /archives/{job_id}/events
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker image (rjyspl/yfs-archive-api)
        - docker compose
        - Built from source
        - Kubernetes / other orchestrator
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or git commit SHA.
      placeholder: "1.0.0 / latest / a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: export_type
    attributes:
      label: Export type
      options:
        - zip
        - tar
        - Not applicable

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS / architecture, Go version (if built from source), PostgreSQL version.
      placeholder: "Debian 13 amd64, Go 1.25.3, PostgreSQL 16"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: JSON log lines around the failure. This is rendered as code automatically.
      render: json

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Archive size, file count, relevant configuration (redacted), screenshots…
